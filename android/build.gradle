allprojects {
    repositories {
        // Google Maven (dl.google.com) answers 404 to requests from Iran, even through
        // the proxy, so AndroidX comes from mirrors first. google() stays as a fallback.
        maven { url "https://maven.myket.ir" }
        maven { url "https://maven.aliyun.com/repository/google" }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}
// Some plugins (just_audio 0.9.42+) pin an older Android Gradle Plugin in their
// own buildscript and fetch it from dl.google.com, which is blocked here. One
// build loads one AGP anyway, so they get the app's version (cached) instead.
subprojects {
    buildscript {
        repositories {
            maven { url "https://maven.myket.ir" }
            maven { url "https://maven.aliyun.com/repository/google" }
        }
        configurations.classpath.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' && details.requested.name == 'gradle') {
                details.useVersion '8.11.1'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

