plugins {
    id "com.android.application"
    id "kotlin-android"
    // Firebase / Google Services (FCM) — must be applied after the Android plugin.
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing: CI passes the upload key through ANDROID_KEYSTORE_* env
// vars; a local machine may use android/key.properties instead (never
// committed). Stores reject debug-signed builds, so CI must not fall back.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def releaseSigning = [
    storeFile: System.getenv("ANDROID_KEYSTORE_PATH") ?: keystoreProperties.getProperty("storeFile"),
    storePassword: System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProperties.getProperty("storePassword"),
    keyAlias: System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProperties.getProperty("keyAlias"),
    keyPassword: System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProperties.getProperty("keyPassword"),
]
def missingReleaseSigningValues = releaseSigning.findAll { key, value ->
    value == null || value.toString().isBlank()
}.keySet()
def hasReleaseSigning = missingReleaseSigningValues.isEmpty()
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(Locale.ROOT).contains("release")
}
if (releaseTaskRequested && !hasReleaseSigning && System.getenv("CI")) {
    throw new GradleException(
        "Missing release signing values: ${missingReleaseSigningValues.join(", ")}."
    )
}

// A machine without the Android NDK sets saimo.noNdk=true in its own
// ~/.gradle/gradle.properties (never in this repo). Release builds in CI need
// the NDK: it strips debug symbols from the native libraries.
def noNdk = (project.findProperty('saimo.noNdk') ?: 'false').toBoolean()

android {
    namespace "app.ravi.saimo"
    compileSdk flutter.compileSdkVersion
    if (noNdk) {
        // Without the NDK, AGP cannot strip debug symbols from .so files, so
        // they are kept. Unstripped libs are huge (~370 MB per ABI), so these
        // builds also drop the debug-only Vulkan validation layer (237 MB).
        packaging {
            jniLibs {
                keepDebugSymbols += ['**/*.so']
                excludes += ['**/libVkLayer_khronos_validation.so']
            }
        }
    } else {
        ndkVersion flutter.ndkVersion
    }

    compileOptions {
        // Required by flutter_local_notifications (uses java.time APIs).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
            }
        }
    }

    defaultConfig {
        applicationId "app.ravi.saimo"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        compileSdkVersion 36
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        debug {
            if (noNdk) {
                // Keeps unstripped debug builds to one ABI; real devices are
                // arm64. An ABI filter clashes with --split-per-abi, so it must
                // never reach release builds.
                ndk {
                    abiFilters 'arm64-v8a'
                }
            }
        }
        release {
            // Without the upload key (a local machine), debug keys keep
            // `flutter run --release` working; CI fails above instead.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

// Kotlin 2.2 removed android { kotlinOptions { } }; the JVM target now lives here.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    // Required by flutter_local_notifications for core library desugaring.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
