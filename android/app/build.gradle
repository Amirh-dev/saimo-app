plugins {
    id "com.android.application"
    id "kotlin-android"
    // Firebase / Google Services (FCM) — must be applied after the Android plugin.
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "app.ravi.saimo"
    compileSdk flutter.compileSdkVersion
    // No ndkVersion: no dependency builds native C/C++ code, so the NDK isn't
    // required. AGP would still download its default NDK just to strip debug
    // symbols from .so files; keeping the symbols skips that step entirely.
    // Cost: a few MB larger APK. Remove this once the NDK is installed.
    // Unstripped libs are huge (~370 MB per ABI), so debug builds are limited
    // to arm64 and drop the debug-only Vulkan validation layer (237 MB).
    packaging {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
            excludes += ['**/libVkLayer_khronos_validation.so']
        }
    }

    compileOptions {
        // Required by flutter_local_notifications (uses java.time APIs).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "app.ravi.saimo"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        compileSdkVersion 36
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        debug {
            ndk {
                // Real devices (this phone included) are arm64. Remove this
                // filter once the NDK is installed and stripping works again.
                abiFilters 'arm64-v8a'
            }
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

// Kotlin 2.2 removed android { kotlinOptions { } }; the JVM target now lives here.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    // Required by flutter_local_notifications for core library desugaring.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
