mutation CreateTask($input: CreateTaskInput!) {
  createTask(input: $input) {
    id
    createdAt
    updatedAt
    title
    shortDescription
    note
    type
    date
    durationM
    elapsedSeconds
    timerStartedAt
    completedAt
    hasReminder
    reminderTime
    recurringDays
    status
    userID
    goalID
    subjectTagID
  }
}