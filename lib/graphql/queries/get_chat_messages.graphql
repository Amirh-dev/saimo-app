query GetChatMessages($chatID: UUID!, $limit: Int, $offset: Int) {
  getChatMessages(chatID: $chatID, limit: $limit, offset: $offset) {
    id
    content
    type
    chatID
    senderID
    replyToID
    isDeleted
    deletedAt
    createdAt
    updatedAt
    replyTo {
      id
      content
      senderID
      createdAt
    }
    sender {
      id
    }
  }
}
