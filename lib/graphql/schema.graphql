schema {
  query: Query
  mutation: Mutation
}

"""
Define a Relay Cursor type:
https://relay.dev/graphql/connections.htm#sec-Cursor
"""
scalar Cursor

scalar Time

type AuthPayload {
  accessToken: String!
  user: User!
}

type Goal implements Node {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  """The core title of the user's goal"""
  title: String!
  """Optional notes or motivational descriptions for the goal"""
  note: String
  """The deadline to achieve this goal"""
  targetDate: Time
  """The current lifecycle status of the goal"""
  status: GoalStatus!
  user: User!
  tasks: [Task!]
}

type Interest implements Node {
  id: ID!
  """The name of the interest"""
  name: String!
  users: [User!]
}

type Mutation {
  sendOTP(input: SendOTPInput!): SendOTPPayload!
  verifyOTPAndRegister(input: VerifyOTPAndRegisterInput!): AuthPayload!
  verifyOTPAndLogin(input: VerifyOTPAndLoginInput!): AuthPayload!
  """
  Refreshes the access token using the HttpOnly refresh token cookie.
  No input is needed because the token is read from the cookies automatically.
  """
  refreshToken: AuthPayload!
  createGoal(input: CreateGoalInput!): Goal!
  updateGoal(id: ID!, input: UpdateGoalInput!): Goal!
  deleteGoal(id: ID!): Boolean!
  """
  Links selected interests to the currently authenticated user.
  Requires a valid access token. At least 3 interests must be selected.
  """
  setUserInterests(interestIds: [ID!]!): User!
  ping: String!
  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  deleteTask(id: ID!): Boolean!
  """Updates the authenticated user's profile information."""
  updateProfile(input: UpdateProfileInput!): User!
}

"""
Information about pagination in a connection.
https://relay.dev/graphql/connections.htm#sec-undefined.PageInfo
"""
type PageInfo {
  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!
  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!
  """When paginating backwards, the cursor to continue."""
  startCursor: Cursor
  """When paginating forwards, the cursor to continue."""
  endCursor: Cursor
}

type Query {
  """Fetches an object given its ID."""
  node(
    """ID of the object."""
    id: ID!,
  ): Node
  """Lookup nodes by a list of IDs."""
  nodes(
    """The list of node IDs."""
    ids: [ID!]!,
  ): [Node]!
  getGoals(status: GoalStatus, limit: Int, offset: Int): [Goal!]!
  getGoal(id: ID!): Goal!
  """Fetches all available interests to display on the selection screen."""
  interests: [Interest!]!
  ping: String!
  """
  Get the list of tasks with optional filtering option like date and pagination support
  """
  getTasks(date: Time, status: TaskStatus, goalID: ID, limit: Int, offset: Int): [Task!]!
  getTask(id: ID!): Task!
  suggestTags(title: String!, shortDescription: String): [String!]!
  """Returns the currently authenticated user's profile with all stats."""
  getMe: User!
}

type SendOTPPayload {
  success: Boolean!
  message: String!
  expiresInSeconds: Int!
  isRegistered: Boolean!
}

type Tag implements Node {
  id: ID!
  """The unique display name of the tag"""
  name: String!
  tasks: [Task!]
}

type Task implements Node {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  """The title of the task"""
  title: String!
  """A brief description or subtitle for the task"""
  shortDescription: String
  """Optional detailed notes for the task"""
  note: String
  """Indicates if the task is a normal to-do or a timed/pomodoro task"""
  type: TaskType!
  """The specific date this task is scheduled for"""
  date: Time!
  """Estimated or tracked duration in minutes"""
  durationM: Int
  """Indicates if the user wants a push notification reminder"""
  hasReminder: Boolean!
  """The specific time to trigger the reminder"""
  reminderTime: Time
  """Comma-separated days for recurring tasks (e.g., MON,WED,FRI)"""
  recurringDays: String
  """The current status of the task"""
  status: TaskStatus!
  user: User!
  goal: Goal
  tags: [Tag!]
}

type User implements Node {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  """User's unique phone number for login"""
  phoneNumber: String!
  fullName: String
  """User's birth date (stored in UTC)"""
  birthDate: Time
  """User's daily study time preference"""
  studyTime: UserStudyTime
  role: UserRole!
  """In-app currency"""
  simoCoins: Int!
  """Gamification points for leaderboard"""
  score: Int!
  """Indicates if the user has an active premium subscription"""
  isPremium: Boolean!
  """User's educational major, occupation, or field of study"""
  major: String
  """User's biography or profile description"""
  bio: String
  interests: [Interest!]
  goals: [Goal!]
  tasks: [Task!]
}

"""
An object with an ID.
Follows the [Relay Global Object Identification Specification](https://relay.dev/graphql/objectidentification.htm)
"""
interface Node {
  """The id of the object."""
  id: ID!
}

"""Properties by which Goal connections can be ordered."""
enum GoalOrderField {
  CREATED_AT
  UPDATED_AT
}

"""GoalStatus is enum for the field status"""
enum GoalStatus {
  IN_PROGRESS
  COMPLETED
  PAUSED
  ARCHIVED
}

"""
Possible directions in which to order a list of items when provided an `orderBy` argument.
"""
enum OrderDirection {
  """Specifies an ascending order for a given `orderBy` argument."""
  ASC
  """Specifies a descending order for a given `orderBy` argument."""
  DESC
}

"""Properties by which Task connections can be ordered."""
enum TaskOrderField {
  CREATED_AT
  UPDATED_AT
}

"""TaskStatus is enum for the field status"""
enum TaskStatus {
  TODO
  IN_PROGRESS
  COMPLETED
