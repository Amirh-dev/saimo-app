}

"""TaskType is enum for the field type"""
enum TaskType {
  NORMAL
  TIMED
}

"""Properties by which User connections can be ordered."""
enum UserOrderField {
  CREATED_AT
  UPDATED_AT
}

"""UserRole is enum for the field role"""
enum UserRole {
  USER
  ADVISOR
  ADMIN
}

"""UserStudyTime is enum for the field study_time"""
enum UserStudyTime {
  UNDER_4_HOURS
  BETWEEN_4_AND_7
  OVER_7_HOURS
}

