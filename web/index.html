<!DOCTYPE html>
<html lang="fa">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="سایمو لرن">
  <meta name="theme-color" content="#F5F5F9">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="سایمو لرن">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>سایمو لرن</title>
  <link rel="manifest" href="manifest.json">

  <!-- Cropper.js 1.6.2 (MIT), for cropping the profile picture on the web
       (image_cropper). Bundled rather than loaded from a CDN, so it works
       wherever the app itself loads. -->
  <link rel="stylesheet" href="vendor/cropperjs/cropper.min.css">
  <script src="vendor/cropperjs/cropper.min.js"></script>

  <!-- Shown from the first byte until Flutter draws its first frame, so the
       engine and app download behind the logo instead of a blank page. Same
       background as the app's own loading screen, so the hand-off is seamless. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F5F5F9; }
    #splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: #F5F5F9;
      transition: opacity 240ms ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img {
      width: 88px; height: 88px; border-radius: 24px;
      box-shadow: 0 10px 30px rgba(35, 35, 43, 0.08);
      animation: splash-in 420ms ease-out both;
    }
    #splash .bar {
      position: relative; overflow: hidden;
      width: 72px; height: 3px; border-radius: 3px;
      background: #EBECF0;
    }
    #splash .bar::after {
      content: ""; position: absolute; inset: 0;
      width: 40%; border-radius: 3px; background: #23232B;
      animation: splash-bar 1.1s ease-in-out infinite;
    }
    @keyframes splash-in {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: none; }
    }
    @keyframes splash-bar {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash img, #splash .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="در حال بارگذاری" role="progressbar">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <!-- Generated by flutter build (from web/flutter_bootstrap.js); loads and
       starts the app. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
